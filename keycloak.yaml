apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: ai
type: Opaque
stringData:
  # See .credentials file for actual values
  KEYCLOAK_ADMIN: "${KEYCLOAK_ADMIN_USER}"
  KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
  KC_DB_PASSWORD: "${KC_DB_PASSWORD}"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-config
  namespace: ai
data:
  ai-lab-realm.json: |
    {
      "realm": "ai-lab",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "bruteForceProtected": true,
      "loginTheme": "ai-lab",
      "accountTheme": "ai-lab",
      "requiredActions": [
        {
          "alias": "terms_and_conditions",
          "name": "Terms and Conditions",
          "providerId": "terms_and_conditions",
          "enabled": true,
          "defaultAction": true,
          "priority": 10
        }
      ],
      "clients": [
        {
          "clientId": "openwebui",
          "name": "Open WebUI",
          "enabled": true,
          "publicClient": false,
          "secret": "${OAUTH_CLIENT_SECRET}",
          "redirectUris": [
            "http://openwebui.local:3100/*",
            "http://openwebui.local/*",
            "http://localhost:3100/*"
          ],
          "webOrigins": [
            "http://openwebui.local:3100",
            "http://openwebui.local",
            "http://localhost:3100"
          ],
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "protocol": "openid-connect",
          "attributes": {
            "pkce.code.challenge.method": "S256"
          },
          "defaultClientScopes": [
            "openid",
            "email",
            "profile"
          ]
        }
      ],
      "users": [
        {
          "username": "admin",
          "email": "admin@ailab.local",
          "enabled": true,
          "emailVerified": true,
          "firstName": "Admin",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "${KEYCLOAK_TEST_USER_PASSWORD}",
              "temporary": false
            }
          ],
          "requiredActions": ["terms_and_conditions"],
          "realmRoles": ["admin"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "admin",
            "description": "Administrator"
          },
          {
            "name": "user",
            "description": "Regular user"
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-theme
  namespace: ai
data:
  theme.properties: |
    parent=keycloak
    import=common/keycloak
    styles=css/login.css

  login.css: |
    /* Open WebUI "System" style for Keycloak */
    :root {
      --owui-bg: #0b0f19;
      --owui-bg-elevated: #111827;
      --owui-surface: #0f172a;
      --owui-surface-2: #1e293b;
      --owui-border: rgba(255, 255, 255, 0.08);
      --owui-border-strong: rgba(255, 255, 255, 0.14);
      --owui-text: #e5e7eb;
      --owui-text-muted: #94a3b8;
      --owui-text-faint: #64748b;
      --owui-accent: #ffffff;
      --owui-accent-text: #0b0f19;
      --owui-danger: #ef4444;
      --owui-success: #22c55e;
      --owui-focus: rgba(255, 255, 255, 0.16);
      --owui-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      --owui-radius-xl: 18px;
      --owui-radius-lg: 14px;
      --owui-radius-md: 12px;
      --owui-radius-sm: 10px;
    }

    html,
    body {
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.035) 0%, rgba(255,255,255,0) 35%),
        linear-gradient(180deg, #0b0f19 0%, #0f172a 100%) !important;
      color: var(--owui-text) !important;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
    }

    body {
      letter-spacing: 0.01em;
    }

    .login-pf,
    .login-pf body {
      background: transparent !important;
      background-image: none !important;
    }

    #kc-header,
    #kc-header-wrapper,
    #kc-locale {
      display: none !important;
    }

    .login-pf-page {
      padding: 48px 16px !important;
    }

    .card-pf {
      background: rgba(15, 23, 42, 0.82) !important;
      border: 1px solid var(--owui-border) !important;
      border-radius: var(--owui-radius-xl) !important;
      box-shadow: var(--owui-shadow) !important;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      max-width: 440px !important;
      margin: 0 auto !important;
      padding: 32px !important;
    }

    #kc-form-wrapper {
      padding: 0 !important;
    }

    #kc-page-title {
      color: var(--owui-text) !important;
      font-size: 1.375rem !important;
      line-height: 1.3 !important;
      font-weight: 650 !important;
      text-align: center !important;
      margin: 0 0 20px 0 !important;
      letter-spacing: -0.01em;
    }

    .control-label,
    label {
      display: block;
      color: var(--owui-text-muted) !important;
      font-weight: 500 !important;
      font-size: 0.92rem !important;
      margin-bottom: 8px !important;
    }

    .form-group {
      margin-bottom: 18px !important;
    }

    .form-control,
    input[type="text"],
    input[type="password"],
    input[type="email"] {
      width: 100% !important;
      height: 46px !important;
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid var(--owui-border) !important;
      border-radius: var(--owui-radius-md) !important;
      color: var(--owui-text) !important;
      box-shadow: none !important;
      padding: 0 14px !important;
      font-size: 0.98rem !important;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease !important;
    }

    .form-control:hover,
    input[type="text"]:hover,
    input[type="password"]:hover,
    input[type="email"]:hover {
      border-color: var(--owui-border-strong) !important;
      background: rgba(255, 255, 255, 0.045) !important;
    }

    .form-control:focus,
    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      border-color: rgba(255, 255, 255, 0.22) !important;
      background: rgba(255, 255, 255, 0.05) !important;
      outline: none !important;
      box-shadow: 0 0 0 4px var(--owui-focus) !important;
    }

    .form-control::placeholder,
    input::placeholder {
      color: var(--owui-text-faint) !important;
      opacity: 1 !important;
    }

    .btn,
    .btn-default,
    .btn-primary,
    input[type="submit"] {
      border-radius: var(--owui-radius-md) !important;
      font-weight: 600 !important;
      font-size: 0.96rem !important;
      height: 46px !important;
      transition: transform 0.12s ease, opacity 0.18s ease, background 0.18s ease, border-color 0.18s ease !important;
    }

    .btn:active,
    .btn-primary:active,
    .btn-default:active,
    input[type="submit"]:active {
      transform: translateY(1px);
    }

    .btn-primary,
    input[type="submit"].btn-primary,
    #kc-login {
      width: 100% !important;
      border: 1px solid rgba(255, 255, 255, 0.88) !important;
      background: #f8fafc !important;
      color: #0f172a !important;
      box-shadow: none !important;
    }

    .btn-primary:hover,
    input[type="submit"].btn-primary:hover,
    #kc-login:hover {
      background: #ffffff !important;
      border-color: #ffffff !important;
      color: #0f172a !important;
      opacity: 0.96;
    }

    .btn-default {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid var(--owui-border) !important;
      color: var(--owui-text) !important;
    }

    .btn-default:hover {
      background: rgba(255, 255, 255, 0.06) !important;
      border-color: var(--owui-border-strong) !important;
      color: var(--owui-text) !important;
    }

    a,
    .login-pf a {
      color: #cbd5e1 !important;
      text-decoration: none !important;
      transition: color 0.18s ease !important;
    }

    a:hover,
    .login-pf a:hover {
      color: #ffffff !important;
      text-decoration: none !important;
    }

    .checkbox {
      margin: 0 !important;
    }

    .checkbox label {
      color: var(--owui-text-muted) !important;
      font-size: 0.9rem !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      margin: 0 !important;
      cursor: pointer;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffffff;
    }

    .alert-error,
    .alert-danger,
    .kc-feedback-text {
      background: rgba(239, 68, 68, 0.08) !important;
      border: 1px solid rgba(239, 68, 68, 0.35) !important;
      color: #fca5a5 !important;
      border-radius: var(--owui-radius-md) !important;
      padding: 12px 14px !important;
      font-size: 0.9rem !important;
      margin-bottom: 16px !important;
    }

    .alert-success {
      background: rgba(34, 197, 94, 0.08) !important;
      border: 1px solid rgba(34, 197, 94, 0.28) !important;
      color: #86efac !important;
      border-radius: var(--owui-radius-md) !important;
      padding: 12px 14px !important;
    }

    .instruction,
    .pf-c-form__helper-text,
    .kcFormGroupClass {
      color: var(--owui-text-muted) !important;
    }

    #kc-info-wrapper {
      margin-top: 22px !important;
      padding-top: 16px !important;
      border-top: 1px solid var(--owui-border) !important;
      text-align: center !important;
      color: var(--owui-text-faint) !important;
      font-size: 0.9rem !important;
    }

    #kc-terms-text {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid var(--owui-border) !important;
      border-radius: var(--owui-radius-lg) !important;
      color: var(--owui-text-muted) !important;
      padding: 18px !important;
      max-height: 320px !important;
      overflow-y: auto !important;
      line-height: 1.65 !important;
      font-size: 0.93rem !important;
      scrollbar-width: thin;
    }

    #kc-terms-text h3,
    #kc-terms-text h4 {
      color: var(--owui-text) !important;
      margin-top: 0 !important;
    }

    .kc-social-links {
      margin-top: 18px !important;
      padding-top: 18px !important;
      border-top: 1px solid var(--owui-border) !important;
    }

    .kc-social-link {
      background: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid var(--owui-border) !important;
      border-radius: var(--owui-radius-md) !important;
      color: var(--owui-text) !important;
      margin-bottom: 8px !important;
    }

    .kc-social-link:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      border-color: var(--owui-border-strong) !important;
    }

    .error-text,
    #input-error {
      color: #fca5a5 !important;
      font-size: 0.875rem !important;
      margin-top: 8px !important;
      display: block !important;
    }

    @media (max-width: 480px) {
      .login-pf-page {
        padding: 20px 12px !important;
      }

      .card-pf {
        padding: 24px 18px !important;
        border-radius: 16px !important;
      }
    }

  login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password') displayInfo=realm.password && realm.registrationAllowed && !registrationDisabled??; section>
        <#if section = "header">
            <div style="text-align:center; margin-bottom: 20px;">
                <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); margin-bottom:14px;">
                    <span style="font-size:1.4rem; color:#e5e7eb;">◎</span>
                </div>
                <h1 style="font-size:1.5rem; line-height:1.2; font-weight:650; color:#e5e7eb; margin:0;">Open WebUI</h1>
                <p style="color:#94a3b8; margin:8px 0 0 0; font-size:0.95rem;">Sign in to continue</p>
            </div>
        <#elseif section = "form">
            <div id="kc-form">
                <div id="kc-form-wrapper">
                    <#if realm.password>
                        <form id="kc-form-login" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
                            <div class="form-group">
                                <label for="username" class="control-label">
                                    <#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if>
                                </label>
                                <input
                                    tabindex="1"
                                    id="username"
                                    class="form-control"
                                    name="username"
                                    value="${(login.username!'')}"
                                    type="text"
                                    autofocus
                                    autocomplete="username"
                                    aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"
                                    placeholder="Email or username" />
                                <#if messagesPerField.existsError('username','password')>
                                    <span id="input-error" class="error-text" aria-live="polite">
                                        ${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}
                                    </span>
                                </#if>
                            </div>

                            <div class="form-group">
                                <label for="password" class="control-label">${msg("password")}</label>
                                <input
                                    tabindex="2"
                                    id="password"
                                    class="form-control"
                                    name="password"
                                    type="password"
                                    autocomplete="current-password"
                                    aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>"
                                    placeholder="Password" />
                            </div>

                            <div class="form-group" style="display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:4px;">
                                <#if realm.rememberMe && !usernameEditDisabled??>
                                    <div class="checkbox">
                                        <label for="rememberMe">
                                            <input tabindex="3" id="rememberMe" name="rememberMe" type="checkbox" <#if login.rememberMe??>checked</#if>>
                                            <span>${msg("rememberMe")}</span>
                                        </label>
                                    </div>
                                </#if>
                                <#if realm.resetPasswordAllowed>
                                    <span><a tabindex="5" href="${url.loginResetCredentialsUrl}">${msg("doForgotPassword")}</a></span>
                                </#if>
                            </div>

                            <div class="form-group" style="margin-top:22px;">
                                <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>/>
                                <input tabindex="4" class="btn btn-primary btn-lg" name="login" id="kc-login" type="submit" value="${msg("doLogIn")}"/>
                            </div>
                        </form>
                    </#if>
                </div>
            </div>
        <#elseif section = "info">
            <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
                <div id="kc-registration-container" style="text-align:center; margin-top:10px;">
                    <span style="color:#94a3b8;">${msg("noAccount")} <a tabindex="6" href="${url.registrationUrl}">${msg("doRegister")}</a></span>
                </div>
            </#if>
        </#if>
    </@layout.registrationLayout>

  terms.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
        <#if section = "header">
            <div style="text-align:center; margin-bottom: 20px;">
                <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); margin-bottom:14px;">
                    <span style="font-size:1.2rem; color:#e5e7eb;">§</span>
                </div>
                <h1 style="font-size:1.4rem; font-weight:650; color:#e5e7eb; margin:0;">Terms and Conditions</h1>
                <p style="color:#94a3b8; margin:8px 0 0 0; font-size:0.95rem;">Review and accept to continue</p>
            </div>
        <#elseif section = "form">
            <div id="kc-terms-text">
                <h3>AI Lab Usage Agreement</h3>

                <p><strong style="color:#e5e7eb;">Welcome to AI Lab.</strong> By accessing and using this platform, you agree to the following terms.</p>

                <h4>1. Acceptable Use</h4>
                <p>You agree to use this AI system responsibly and ethically. You will not use it to generate harmful, illegal, or malicious content.</p>

                <h4>2. Data Privacy</h4>
                <p>Your conversations may be logged for system improvement and monitoring purposes. Do not share sensitive personal information, credentials, or confidential data.</p>

                <h4>3. AI Limitations</h4>
                <p>AI responses are generated automatically and may contain errors. Verify important information through authoritative sources before relying on it.</p>

                <h4>4. No Warranty</h4>
                <p>This service is provided as is, without warranties of any kind. Administrators are not liable for damages arising from use of the system.</p>

                <h4>5. Monitoring</h4>
                <p>Usage may be monitored and logged for security, compliance, and operational purposes.</p>

                <p style="margin-top:16px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);"><em>By clicking “I Agree,” you confirm that you have read, understood, and accepted these terms.</em></p>
            </div>

            <form class="form-actions" action="${url.loginAction}" method="POST">
                <div style="display:flex; gap:12px; margin-top:20px;">
                    <input class="btn btn-primary btn-lg" style="flex:1;" name="accept" id="kc-accept" type="submit" value="I Agree"/>
                    <input class="btn btn-default btn-lg" style="flex:1;" name="cancel" id="kc-decline" type="submit" value="Decline"/>
                </div>
            </form>
        </#if>
    </@layout.registrationLayout>

  info.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false; section>
        <#if section = "header">
            <div style="text-align:center; margin-bottom: 20px;">
                <div style="display:inline-flex; align-items:center; justify-content:center; width:56px; height:56px; border-radius:16px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); margin-bottom:14px;">
                    <span style="font-size:1.2rem; color:#e5e7eb;">◌</span>
                </div>
                <h1 style="font-size:1.4rem; font-weight:650; color:#e5e7eb; margin:0;">Signed out</h1>
                <p style="color:#94a3b8; margin:8px 0 0 0; font-size:0.95rem;">You have been logged out of Open WebUI</p>
            </div>
        <#elseif section = "form">
            <div style="text-align:center; padding: 8px 0 0 0;">
                <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:24px; margin-bottom:18px;">
                    <p style="color:#e5e7eb; font-size:1.05rem; margin:0 0 10px 0;">Session ended successfully</p>
                    <p style="color:#94a3b8; margin:0;">Redirecting to login page in <span id="countdown" style="color:#ffffff; font-weight:600;">5</span> seconds.</p>
                </div>
                <a href="http://openwebui.local:3100" class="btn btn-primary" style="display:inline-flex; align-items:center; justify-content:center; min-width:220px; text-decoration:none;">
                    Return to Open WebUI
                </a>
            </div>
            <script>
                var seconds = 5;
                var countdown = document.getElementById('countdown');
                var interval = setInterval(function() {
                    seconds--;
                    if (countdown) countdown.textContent = seconds;
                    if (seconds <= 0) {
                        clearInterval(interval);
                        window.location.href = 'http://openwebui.local:3100';
                    }
                }, 1000);
            </script>
        </#if>
    </@layout.registrationLayout>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: setup-theme
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /themes/ai-lab/login/resources/css
              cp /theme-config/theme.properties /themes/ai-lab/login/
              cp /theme-config/login.css /themes/ai-lab/login/resources/css/
              cp /theme-config/login.ftl /themes/ai-lab/login/
              cp /theme-config/terms.ftl /themes/ai-lab/login/
              cp /theme-config/info.ftl /themes/ai-lab/login/
              echo "Theme setup complete"
              ls -la /themes/ai-lab/login/
          volumeMounts:
            - name: theme-config
              mountPath: /theme-config
            - name: themes
              mountPath: /themes
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:24.0
          args:
            - start-dev
            - --import-realm
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://langfuse-db-postgresql.ai.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secret
                  key: KC_DB_PASSWORD
            - name: KC_PROXY
              value: edge
            - name: KC_HOSTNAME_URL
              value: "http://keycloak.local:3100"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "http://keycloak.local:3100"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_BACKCHANNEL
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-config
              mountPath: /opt/keycloak/data/import
            - name: themes
              mountPath: /opt/keycloak/themes
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      volumes:
        - name: realm-config
          configMap:
            name: keycloak-realm-config
        - name: theme-config
          configMap:
            name: keycloak-theme
        - name: themes
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ai
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: external
      port: 3100
      targetPort: 8080
