image:
  repository: docker.litellm.ai/berriai/litellm
  tag: main-latest

service:
  type: ClusterIP
  port: 4000

env:
  # See .credentials file for actual values
  LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY}"
  LITELLM_ENABLE_ADMIN_UI: "true"
  DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD}@langfuse-db-postgresql.ai.svc.cluster.local:5432/litellm"

  # IMPORTANT: Get these from Langfuse UI after creating a project
  LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY}"
  LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY}"

  # Langfuse host (internal cluster service URL)
  LANGFUSE_HOST: "http://langfuse.ai.svc.cluster.local:3000"

configYaml: |
  litellm_settings:
    callbacks: ["langfuse"]
    success_callback: ["langfuse"]
    failure_callback: ["langfuse"]

  model_list:
    - model_name: llama3.2
      litellm_params:
        model: ollama/llama3.2:1b
        api_base: http://ollama.ai.svc.cluster.local:11434
    - model_name: llama3.2-3b
      litellm_params:
        model: ollama/llama3.2:latest
        api_base: http://ollama.ai.svc.cluster.local:11434
